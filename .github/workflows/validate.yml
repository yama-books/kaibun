name: Validate palindrome corpus
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/validate-corpus.mjs"
      - "scripts/validate-ui.mjs"
      - "scripts/generate-central-pivot-research.mjs"
      - "scripts/generate-scene-microgrammar-research.mjs"
      - "scripts/generate-naha-outer-frame-research.mjs"
      - "scripts/generate-modern-seam-bridge.mjs"
      - "scripts/validate-modern-bridge-public.mjs"
      - "scripts/simulate-growth-wrapper-role-gate.mjs"
      - "scripts/build-public-quality-benchmark.mjs"
      - "scripts/validate-public-reading-hints.mjs"
      - "docs/TANKA_MIRROR_LATTICE_V28.md"
      - "data/historical-kaibunka-mining-v28.json"
      - "data/tanka-mirror-lattice-v28.json"
      - "docs/EDO_KAIBUNKA_SAMPLES_V27.md"
      - "data/historical-kaibunka-samples-v27.json"
      - "docs/HISTORICAL_SEMANTIC_FIELDS_V32.md"
      - "docs/HISTORICAL_EDGE_PAIRS_V33.md"
      - "docs/TANKA_FIVE_VARIABLE_GRAMMAR_V34.md"
      - "docs/HISTORICAL_FACTOR_HYBRIDS_V35.md"
      - "docs/HISTORICAL_SEAM_SIGNATURES_V36.md"
      - "docs/HISTORICAL_HYBRID_REVIEW_V37.md"
      - "docs/HISTORICAL_CENTO_V38.md"
      - "index.html"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate-corpus.mjs"
      - "scripts/validate-ui.mjs"
      - "index.html"
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate corpus and DNA
        run: node scripts/validate-corpus.mjs
      - name: Validate historical central-pivot generator
        run: node scripts/generate-central-pivot-research.mjs --check
      - name: Validate historical scene microgrammar generator
        run: node scripts/generate-scene-microgrammar-research.mjs --check
      - name: Validate naha outer-frame generator
        run: node scripts/generate-naha-outer-frame-research.mjs --check
      - name: Validate modern seam bridge prototype
        run: node scripts/generate-modern-seam-bridge.mjs --check
      - name: Validate public bridge whitelist
        run: node scripts/validate-modern-bridge-public.mjs
      - name: Validate growth wrapper role gate
        run: node scripts/simulate-growth-wrapper-role-gate.mjs --check
      - name: Validate public quality benchmark seed
        run: node scripts/build-public-quality-benchmark.mjs --check
      - name: Validate public reading hints
        run: node scripts/validate-public-reading-hints.mjs
      - name: Validate public UI
        run: node scripts/validate-ui.mjs
