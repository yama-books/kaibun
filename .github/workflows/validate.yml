name: Validate palindrome corpus
on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/validate-corpus.mjs"
      - "scripts/validate-ui.mjs"
      - "scripts/generate-central-pivot-research.mjs"
      - "scripts/generate-scene-microgrammar-research.mjs"
      - "scripts/generate-naha-outer-frame-research.mjs"
      - "scripts/generate-musu-moon-outer-frame-research.mjs"
      - "scripts/generate-wave2-travel-outer-frame-research.mjs"
      - "scripts/validate-historical-orthographic-equivalence.mjs"
      - "scripts/generate-modern-seam-bridge.mjs"
      - "scripts/validate-modern-bridge-public.mjs"
      - "scripts/simulate-growth-wrapper-role-gate.mjs"
      - "scripts/build-public-quality-benchmark.mjs"
      - "scripts/validate-public-reading-hints.mjs"
      - "scripts/validate-dna-kinship-exposure.mjs"
      - "scripts/validate-ten-comparison-balance.mjs"
      - "scripts/generate-nonkinship-quote-expansion.mjs"
      - "scripts/generate-nonkinship-reaction-expansion.mjs"
      - "scripts/validate-nonkinship-growth-rollout.mjs"
      - "scripts/validate-l2-ten-comparison-policy.mjs"
      - "scripts/validate-human-quality-review.mjs"
      - "scripts/import-human-quality-review.mjs"
      - "docs/TANKA_MIRROR_LATTICE_V28.md"
      - "data/historical-kaibunka-mining-v28.json"
      - "data/tanka-mirror-lattice-v28.json"
      - "docs/EDO_KAIBUNKA_SAMPLES_V27.md"
      - "data/historical-kaibunka-samples-v27.json"
      - "docs/HISTORICAL_SEMANTIC_FIELDS_V32.md"
      - "docs/HISTORICAL_EDGE_PAIRS_V33.md"
      - "docs/TANKA_FIVE_VARIABLE_GRAMMAR_V34.md"
      - "docs/HISTORICAL_FACTOR_HYBRIDS_V35.md"
      - "docs/HISTORICAL_SEAM_SIGNATURES_V36.md"
      - "docs/HISTORICAL_HYBRID_REVIEW_V37.md"
      - "docs/HISTORICAL_CENTO_V38.md"
      - "index.html"
      - ".github/workflows/validate.yml"
  pull_request:
    paths:
      - "data/**"
      - "scripts/validate-corpus.mjs"
      - "scripts/validate-ui.mjs"
      - "scripts/validate-dna-kinship-exposure.mjs"
      - "scripts/validate-ten-comparison-balance.mjs"
      - "scripts/generate-nonkinship-quote-expansion.mjs"
      - "scripts/generate-nonkinship-reaction-expansion.mjs"
      - "scripts/validate-nonkinship-growth-rollout.mjs"
      - "scripts/validate-l2-ten-comparison-policy.mjs"
      - "scripts/validate-human-quality-review.mjs"
      - "index.html"
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate corpus and DNA
        run: node scripts/validate-corpus.mjs
      - name: Validate historical central-pivot generator
        run: node scripts/generate-central-pivot-research.mjs --check
      - name: Validate historical scene microgrammar generator
        run: node scripts/generate-scene-microgrammar-research.mjs --check
      - name: Validate naha outer-frame generator
        run: node scripts/generate-naha-outer-frame-research.mjs --check
      - name: Validate musu moon outer-frame generator
        run: node scripts/generate-musu-moon-outer-frame-research.mjs --check
      - name: Validate wave2 travel outer-frame generator
        run: node scripts/generate-wave2-travel-outer-frame-research.mjs --check
      - name: Validate historical orthographic equivalence diagnostic
        run: node scripts/validate-historical-orthographic-equivalence.mjs
      - name: Validate modern seam bridge prototype
        run: node scripts/generate-modern-seam-bridge.mjs --check
      - name: Validate public bridge whitelist
        run: node scripts/validate-modern-bridge-public.mjs
      - name: Validate growth wrapper role gate
        run: node scripts/simulate-growth-wrapper-role-gate.mjs --check
      - name: Validate public quality benchmark seed
        run: node scripts/build-public-quality-benchmark.mjs --check
      - name: Validate public reading hints
        run: node scripts/validate-public-reading-hints.mjs
      - name: Validate DNA kinship exposure
        run: node scripts/validate-dna-kinship-exposure.mjs
      - name: Validate ten-item comparison balance
        run: node scripts/validate-ten-comparison-balance.mjs
      - name: Validate non-kinship quote expansion
        run: node scripts/generate-nonkinship-quote-expansion.mjs --check
      - name: Validate non-kinship reaction expansion
        run: node scripts/generate-nonkinship-reaction-expansion.mjs --check
      - name: Validate non-kinship growth rollout
        run: node scripts/validate-nonkinship-growth-rollout.mjs
      - name: Validate L2 ten-item comparison cap
        run: node scripts/validate-l2-ten-comparison-policy.mjs
      - name: Validate human quality review protocol
        run: node scripts/validate-human-quality-review.mjs
      - name: Validate human review importer baseline
        run: node scripts/import-human-quality-review.mjs --check
      - name: Validate public UI
        run: node scripts/validate-ui.mjs
