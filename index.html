<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>怪文回文メーカー</title>
<style>
:root{--bg:#f5f0e8;--paper:#fffdf8;--ink:#22211e;--sub:#6f6a61;--line:#d8d0c2;--green:#315d59;--wine:#755055;--soft:#eee7dc}
*{box-sizing:border-box}
body{margin:0;font-family:"Yu Gothic UI","Hiragino Sans","Meiryo",sans-serif;background:radial-gradient(circle at 12% 8%,rgba(117,79,82,.09),transparent 26%),radial-gradient(circle at 88% 15%,rgba(49,93,89,.07),transparent 24%),var(--bg);color:var(--ink)}
.wrap{max-width:1080px;margin:auto;padding:28px 18px 60px}
header{display:flex;justify-content:space-between;gap:16px;align-items:start}
h1{font-size:clamp(29px,6vw,50px);margin:0 0 7px}
.sub{color:var(--sub);line-height:1.65}
.badge{border:1px solid var(--line);background:var(--paper);padding:7px 11px;border-radius:99px;font-size:12px;white-space:nowrap}
.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px;box-shadow:0 10px 28px rgba(40,35,25,.05)}
.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.layer{border:1px solid var(--line);background:white;border-radius:13px;padding:12px;cursor:pointer;text-align:left}
.layer.active{background:var(--ink);color:white}
.layer b{display:block;font-size:15px}.layer small{opacity:.72}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.toolbar button{border:1px solid var(--line);background:white;padding:10px 13px;border-radius:11px;cursor:pointer}
.toolbar .primary{background:var(--ink);color:white;border-color:var(--ink);font-weight:800}
.toolbar .dna{background:var(--green);color:#fff;border-color:var(--green);font-weight:800}
.result{font-weight:900;font-size:clamp(25px,5vw,42px);line-height:1.55;margin:18px 0 8px}
.reading{font-family:ui-monospace,Consolas,monospace;color:var(--sub);word-break:break-all}
.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}
.pill{border:1px solid var(--line);border-radius:99px;padding:5px 9px;font-size:12px}
.ok{color:#28684f;background:#f1fbf5}.dnaPill{color:#315d59;background:#eef8f5}
.note{border-left:4px solid var(--green);background:#f1f7f5;padding:10px 12px;margin-top:16px;line-height:1.65}
.mirror{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin-top:17px}
.ch{width:28px;height:33px;display:grid;place-items:center;background:white;border:1px solid var(--line);border-radius:7px}
.ch.on{background:#2d3b39;color:white}
.list{display:grid;gap:8px;margin-top:14px}
.item{padding:10px 12px;border:1px solid var(--line);background:white;border-radius:10px;cursor:pointer;line-height:1.5}
.item small{color:var(--sub)}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
.stat{background:var(--soft);border-radius:10px;padding:7px 10px;font-size:12px}
.controls{display:flex;gap:14px 18px;align-items:center;flex-wrap:wrap;margin-top:13px}
.controls label{font-size:12px;color:var(--sub)}
.controls input[type=range]{width:150px;vertical-align:middle}
select{border:1px solid var(--line);background:white;color:var(--ink);padding:7px 9px;border-radius:9px}
.growthBox{margin-top:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;background:#fff}
.growthHead{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.growthActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.growthActions button{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:10px;cursor:pointer}
.growthActions #growOne{background:var(--green);border-color:var(--green);color:white;font-weight:800}
.growthTrail{display:grid;gap:6px;margin-top:12px}
.trailItem{border-left:3px solid var(--line);padding:7px 9px;background:var(--soft);border-radius:0 8px 8px 0;font-size:12px;cursor:pointer;line-height:1.5}
.trailItem.current{border-left-color:var(--green);background:#eef8f5;font-weight:700}
.trailItem span{color:var(--sub);margin-right:6px}
.wrapBox{margin-top:14px;padding-top:13px;border-top:1px solid var(--line)}
.wrapActions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:9px}
.wrapActions button{border:1px solid var(--line);background:white;padding:9px 12px;border-radius:10px;cursor:pointer}
.wrapActions #wrapSentence{background:var(--wine);border-color:var(--wine);color:white;font-weight:800}
@media(max-width:650px){header{display:block}.badge{display:inline-block;margin-top:8px}.layers{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>怪文回文メーカー</h1><div class="sub">まず、日本語として通す。そこから一段ずつ、鏡の奥へ伸ばす。</div></div>
  <div class="badge">v0.25 / 境界ずらしDNA</div>
</header>

<div class="card">
  <div class="layers">
    <button class="layer active" data-layer="L1"><b>第一層　標準日本語</b><small id="c1">–</small></button>
    <button class="layer" data-layer="L2"><b>第二層　意味の通る怪文</b><small id="c2">–</small></button>
    <button class="layer" data-layer="L3"><b>第三層　実験文</b><small id="c3">–</small></button>
  </div>
  <div class="note" id="policy">読み込み中…</div>
  <div class="stats">
    <span class="stat" id="ruleStat">DNA規則 –</span>
    <span class="stat" id="recursiveStat">再帰候補 –</span>
    <span class="stat" id="pairStat">逆語ペア –</span>
    <span class="stat" id="uniqueStat">実効候補 –</span>
    <span class="stat" id="storyStat">物語型 –</span><span class="stat" id="benchmarkStat">100かな基準 –</span><span class="stat" id="wrapperStat">外枠 –</span><span class="stat" id="seamStat">継ぎ目 –</span>
    <span class="stat">全件回文検証</span>
  </div>
  <div class="controls">
    <label>怪文度上限 <b id="weirdVal">2</b> <input id="weird" type="range" min="1" max="5" value="2" step="1"></label>
  </div>

  <div class="growthBox">
    <div class="growthHead">
      <div>
        <b>段階的長文化</b>
        <div class="sub" style="font-size:12px">「1段伸ばす」だけで、内容を増やし、終点後は文レベルの外枠へ続きます。</div>
      </div>
      <span class="stat" id="growthStage">段階 0 / 4</span>
    </div>
    <div class="controls">
      <label>タイプ
        <select id="growthMode">
          <option value="structural">構文型</option>
          <option value="narrative">物語型</option>
        </select>
      </label>
      <label>足す情報 <select id="growthDimension"></select></label>
      <label>骨格 <select id="growthFamily"></select></label>
    </div>
    <div class="growthActions">
      <button id="growthStart">長文化を開始</button>
      <button id="growOne">1段伸ばす</button>
      <button id="growAgain">同段階で別案</button>
      <button id="growBack">1段戻す</button>
    </div>
    <div class="growthTrail" id="growthTrail"></div>
    <div class="wrapBox">
      <b>文レベル長文化</b>
      <div class="sub" style="font-size:12px">今の文全体を引用内容として外側から包みます。何段でも繰り返せます。</div>
      <div class="wrapActions">
        <select id="sentenceWrapper"></select>
        <button id="wrapSentence">文を1段包む</button>
        <button id="unwrapSentence">1段ほどく</button>
        <span class="stat" id="wrapDepth">外枠 0段</span>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="toolbar">
    <button class="primary" id="seedGen">原種から1本</button>
    <button class="dna" id="dnaGen">DNAで1本生成</button>
    <button id="pairGen">逆語ペア</button><button id="seamGen">継ぎ目型DNA</button>
    <button id="growCurrent">この文から伸ばす</button>
    <button id="ten">10本比較</button>
  </div>
  <div class="result" id="result">読み込み中…</div>
  <div class="reading" id="reading"></div>
  <div class="meta">
    <span class="pill" id="pal">–</span>
    <span class="pill" id="quality">日本語 –</span>
    <span class="pill" id="weirdMeta">怪文 –</span>
    <span class="pill" id="family">–</span>
    <span class="pill dnaPill" id="origin">–</span>
  </div>
  <div class="note" id="why"></div>
  <div class="mirror" id="mirror"></div>
  <div class="list" id="list"></div>
</div>
</div>

<script>
let data=null,rules=null,pairs=null,growth=null,seams=null,layer="L1",seen=new Set(),currentShown=null;
let growthState={mode:"structural",dimension:"all",familyId:null,stage:0,lastCenter:null,history:{}};

const $=s=>document.querySelector(s);
const rev=s=>[...s].reverse().join("");
const isPal=s=>s===rev(s);

async function init(){
  [data,rules,pairs,growth,seams]=await Promise.all([
    fetch("./data/layered-seeds-v08.json").then(r=>r.json()),
    fetch("./data/generation-rules-v08.json").then(r=>r.json()),
    fetch("./data/reverse-lexeme-pairs-v09.json").then(r=>r.json()),
    fetch("./data/growth-engine-v10.json").then(r=>r.json()),
    fetch("./data/seam-grammar-v25.json").then(r=>r.json())
  ]);
  $("#c1").textContent=data.counts.L1+"本";
  $("#c2").textContent=data.counts.L2+"本";
  $("#c3").textContent=data.counts.L3+"本";
  $("#ruleStat").textContent="DNA規則 "+rules.rule_count+"種";
  const rs=rules.verified_recursive_space;
  $("#recursiveStat").textContent=rs?("再帰 "+rs.sentence_variants.toLocaleString()+"文"):"再帰候補 –";
  $("#pairStat").textContent="逆語 "+pairs.pair_count+"組 / "+pairs.variant_count+"文";
  $("#storyStat").textContent="物語 "+(growth.verified?.narrative_family_count||0)+"系統 / "+(growth.verified?.narrative_variants||0)+"段階 / 最長 "+(growth.verified?.longest_narrative_kana||"–")+"かな";
  $("#benchmarkStat").textContent="固定基準 "+(growth.verified?.hundred_kana_benchmark?.length||"–")+"かな";
  $("#wrapperStat").textContent="外枠 "+(growth.verified?.sentence_level_wrapper_count||0)+"種 / 外側語彙 "+(growth.verified?.wrapper_distinct_outer_readings||0)+"種 / 重複回避ON";
  populateGrowthDimensions();
  populateGrowthFamilies();
  populateSentenceWrappers();
  updatePolicy();
  seedOne();
}

function uniqueByReading(arr){
  const m=new Map();
  for(const x of arr)if(x?.reading&&!m.has(x.reading))m.set(x.reading,x);
  return [...m.values()];
}
function defaultWeird(l){return l==="L1"?1:l==="L2"?3:4}
function maxWeird(){return +$("#weird").value}
function pool(){return uniqueByReading(data.records.filter(x=>x.layer===layer && (x.weirdness??defaultWeird(x.layer))<=maxWeird()))}

function variantLayer(rule,v){
  if(v&&["L1","L2","L3"].includes(v[2]))return v[2];
  if((rule.layer||"").includes("/"))return null;
  return rule.layer;
}
function pushDNA(out,rule,display,reading,l,weirdness){
  const w=weirdness??rule.weirdness??defaultWeird(l);
  if(l!==layer||!isPal(reading)||w>maxWeird())return;
  out.push({display,reading,family:rule.type||"DNA",origin:rule.id,why:rule.description||"検証済みDNA規則",japanese_quality:l==="L1"?"A":l==="L2"?"A-":"C",weirdness:w});
}
function recursiveNPs(rule,maxDepth){
  const levels=[rule.bases.map(x=>({...x,depth:0}))];
  for(let d=1;d<=Math.min(maxDepth,rule.max_depth);d++){
    const cur=[];
    for(const w of rule.wrappers)for(const inner of levels[d-1]){
      if(rule.constraints?.no_same_adjacent_relation&&w.reading===inner.edge)continue;
      cur.push({reading:w.reading+"の"+inner.reading+"の"+w.reading,display:w.display+"の"+inner.display+"の"+w.display,depth:d,edge:w.reading});
    }
    levels.push(cur);
  }
  return levels.flat();
}
function recursivePool(){
  const out=[];
  for(const rule of rules.rules.filter(r=>r.type==="recursive_kinship")){
    for(const np of recursiveNPs(rule,1)){
      const w=rule.weirdness_by_depth?.[np.depth]??(1+np.depth);
      for(const f of rule.frames)pushDNA(out,rule,f.display.replace("{np}",np.display),f.left+np.reading+f.right,rule.layer,w);
    }
  }
  return uniqueByReading(out);
}
function pairPool(){
  const out=[];
  for(const p of pairs.pairs){
    if(p.right.reading!==rev(p.left.reading))continue;
    for(const v of p.variants){
      if(v.layer!==layer||v.weirdness>maxWeird())continue;
      const reading=p.left.reading+v.particle+p.right.reading;
      const display=p.left.display+v.particle+(v.right_display||p.right.display)+"。";
      if(!isPal(reading))continue;
      out.push({display,reading,family:"逆語ペア",origin:"PAIR:"+p.id,why:"名詞と逆読み述語の間に、文法的に許可した助詞だけを置く。",japanese_quality:v.layer==="L1"?"A":"A-",weirdness:v.weirdness});
    }
  }
  return uniqueByReading(out);
}
function dnaPool(includeRecursive=true){
  const out=[];
  for(const rule of rules.rules){
    if(rule.type==="recursive_kinship")continue;
    if(rule.type==="fixed"){pushDNA(out,rule,rule.display,rule.reading,rule.layer);continue}
    if(rule.type==="particle_pair"){for(const v of rule.variants||[])pushDNA(out,rule,v[1],rule.left+v[0]+rule.right,rule.layer);continue}
    if(rule.type==="mirrored_coordination"){for(const v of rule.variants||[])pushDNA(out,rule,v[1],rule.reading_pattern.replace("{person}",v[0]),rule.layer);continue}
    for(const v of rule.variants||[]){
      const l=variantLayer(rule,v)||(rule.layer||"").split("/")[0];
      let reading=rule.reading_pattern||"";
      if(reading.includes("{c}"))reading=reading.replace("{c}",v[0]);
      if(reading.includes("{pal_center}"))reading=reading.replace("{pal_center}",v[0]);
      pushDNA(out,rule,v[1],reading,l);
    }
  }
  out.push(...pairPool());
  if(includeRecursive)out.push(...recursivePool());
  return uniqueByReading(out);
}

function findGrowthMatch(reading){
  if(!growth||!reading)return null;
  for(const f of growth.families||[]){
    if(f.stage0?.[0]===reading)return {mode:"structural",family:f,stage:0,dimension:"all",layer:"L1"};
  }
  for(const f of growth.narrative_families||[]){
    const st=(f.stages||[]).findIndex(x=>x.reading===reading);
    if(st>=0)return {mode:"narrative",family:f,stage:st,dimension:f.dimension||"all",layer:f.layer||"L1"};
  }
  return null;
}
function syncGrowCurrentButton(){
  const m=findGrowthMatch(currentShown?.reading);
  $("#growCurrent").disabled=!m;
  $("#growCurrent").style.opacity=m?"1":".38";
  $("#growCurrent").title=m?"この文に対応する長文化系統を開きます":"この文にはまだ長文化系統がありません";
}
function wrapperConflicts(w,x=currentShown){
  if(!x)return false;
  return (w.outer_lexemes||[]).some(l=>
    (l.display&&String(x.display||"").includes(l.display))||
    (l.reading&&String(x.reading||"").includes(l.reading))
  );
}
function compatibleSentenceWrappers(x=currentShown){
  return [...(growth.sentence_level_wrappers||[])]
    .filter(w=>!wrapperConflicts(w,x))
    .sort((a,b)=>(a.auto_priority??999)-(b.auto_priority??999));
}
function populateSentenceWrappers(){
  const sel=$("#sentenceWrapper");
  const previous=sel.value||"auto";
  const list=compatibleSentenceWrappers();
  sel.innerHTML="";
  const auto=document.createElement("option");
  auto.value="auto";
  auto.textContent="自動（名詞重複回避＋語彙分散）";
  sel.appendChild(auto);
  for(const w of list){
    const o=document.createElement("option");
    o.value=w.id;
    o.textContent=w.semantic+"："+w.left_display+"…"+w.right_display;
    sel.appendChild(o);
  }
  sel.value=list.some(w=>w.id===previous)?previous:"auto";
  sel.title=list.length+"種類の衝突なし外枠";
}
function stableReadingHash(text){
  let h=0;
  for(const c of String(text||""))h=(h*31+c.codePointAt(0))>>>0;
  return h;
}
function sentenceWrapper(){
  const list=compatibleSentenceWrappers();
  if(!list.length)return null;
  const selected=$("#sentenceWrapper").value;
  if(selected&&selected!=="auto"){
    const manual=list.find(w=>w.id===selected);
    if(manual)return manual;
  }
  const top=list.slice(0,Math.min(5,list.length));
  const depth=currentShown?.wrap_depth||0;
  return top[(stableReadingHash(currentShown?.reading)+depth)%top.length];
}
function stripFinalPeriod(text){return text?.endsWith("。")?text.slice(0,-1):text}
function syncSentenceWrapControls(){
  populateSentenceWrappers();
  const compatible=compatibleSentenceWrappers();
  const canWrap=!!currentShown&&isPal(currentShown.reading)&&(layer!=="L3"||currentShown?.wrap_depth>0)&&compatible.length>0;
  $("#wrapSentence").disabled=!canWrap;
  $("#unwrapSentence").disabled=!currentShown?.wrapped_from;
  $("#wrapSentence").style.opacity=$("#wrapSentence").disabled?".38":"1";
  $("#unwrapSentence").style.opacity=$("#unwrapSentence").disabled?".38":"1";
  const d=currentShown?.wrap_depth||0;
  const total=(growth.sentence_level_wrappers||[]).length;
  $("#wrapDepth").textContent="外枠 "+d+"段 / 候補 "+compatible.length+" / 重複除外 "+(total-compatible.length);
  $("#wrapMeta").textContent="外枠 "+d;
}
function seamPool(){
  if(!seams)return [];
  return (seams.recipes||[])
    .filter(r=>r.layer===layer && (r.weirdness??1)<=maxWeird())
    .map(r=>({
      display:r.display,
      reading:r.reading,
      family:"継ぎ目型DNA",
      origin:"SEAM:"+r.id,
      japanese_quality:r.japanese_quality||"A-",
      weirdness:r.weirdness??2,
      why:"語境界を鏡像位置とそろえず、助詞ヒンジと役割転換で全文を成立させています。境界ずらし "+(r.boundary_shift_shells||0)+" / 助詞ヒンジ "+(r.particle_hinges||0),
      seam_recipe:r.id,
      boundary_shift_shells:r.boundary_shift_shells||0,
      particle_hinges:r.particle_hinges||0
    }));
}
function seamOne(){show(chooseFresh(seamPool()))}
function updateCandidateCount(){
  const all=uniqueByReading([...pool().map(x=>({...x,origin:"原種"})),...dnaPool(true),...seamPool()]);
  $("#uniqueStat").textContent="実効候補 "+all.length.toLocaleString()+"種";
}
function syncControls(){
  const need=layer==="L1"?1:layer==="L2"?3:4;
  if(maxWeird()<need){$("#weird").value=need;$("#weirdVal").textContent=need}
  $("#pairGen").disabled=layer==="L3";
  $("#dnaGen").disabled=layer==="L3";
  $("#seamGen").disabled=seamPool().length===0;
  $("#seamGen").style.opacity=$("#seamGen").disabled?".38":"1";

  const structuralOption=[...$("#growthMode").options].find(o=>o.value==="structural");
  const narrativeOption=[...$("#growthMode").options].find(o=>o.value==="narrative");
  structuralOption.disabled=layer!=="L1";
  const narrativeAvailable=(growth.narrative_families||[]).some(f=>(f.layer||"L1")===layer);
  narrativeOption.disabled=!narrativeAvailable;

  if(layer!=="L1"&&growthState.mode==="structural"&&narrativeAvailable){
    growthState.mode="narrative";$("#growthMode").value="narrative";
  }else if(!narrativeAvailable&&growthState.mode==="narrative"&&layer==="L1"){
    growthState.mode="structural";$("#growthMode").value="structural";
  }
  populateGrowthDimensions();
  populateGrowthFamilies();

  const growthDisabled=growthFamilies().length===0;
  for(const id of ["growthStart","growOne","growAgain","growBack"])$("#"+id).disabled=growthDisabled;
  for(const id of ["pairGen","dnaGen"])$("#"+id).style.opacity=$("#"+id).disabled?".38":"1";
  updateGrowthStageLabel();
}
function updatePolicy(){$("#policy").textContent=data.policy[layer];syncControls();updateCandidateCount()}

function chooseFresh(p){
  if(!p.length)return null;
  let q=p.filter(x=>!seen.has(x.reading));
  if(!q.length){seen.clear();q=p}
  const x=q[Math.floor(Math.random()*q.length)];
  seen.add(x.reading);
  return x;
}
function show(x){
  if(!x){$("#result").textContent="この条件では候補がありません。";return}
  currentShown=x;
  $("#result").textContent=x.display;
  $("#reading").textContent=x.reading;
  $("#pal").textContent=isPal(x.reading)?"✓ 完全回文":"× 不成立";
  $("#pal").className="pill "+(isPal(x.reading)?"ok":"");
  $("#quality").textContent="日本語 "+(x.japanese_quality||(layer==="L1"?"A":layer==="L2"?"B":"C"));
  $("#weirdMeta").textContent="怪文 "+(x.weirdness??defaultWeird(layer));
  $("#lengthMeta").textContent="長さ "+[...x.reading].length+"かな";
  $("#family").textContent=x.family||x.subgroup||layer;
  $("#origin").textContent=x.origin||"原種コーパス";
  $("#why").textContent=x.why||x.rationale||"検証済み原種。";
  syncGrowCurrentButton();
  syncSentenceWrapControls();
  updateGrowthStageLabel();
  const m=$("#mirror");m.innerHTML="";
  const a=[...x.reading];
  a.forEach((c,i)=>{
    const e=document.createElement("span");e.className="ch";e.textContent=c;
    const t=v=>{const n=[...document.querySelectorAll(".ch")];[i,n.length-1-i].forEach(k=>n[k]?.classList.toggle("on",v))};
    e.onmouseenter=()=>t(true);e.onmouseleave=()=>t(false);m.appendChild(e);
  });
}
function seedOne(){const x=chooseFresh(pool());show(x?{...x,origin:"原種コーパス"}:null)}
function dnaOne(){show(chooseFresh(dnaPool(true)))}
function pairOne(){show(chooseFresh(pairPool()))}

function narrativeFamiliesForLayer(){
  return (growth.narrative_families||[]).filter(f=>(f.layer||"L1")===layer);
}
function growthFamilies(){
  if(growthState.mode==="narrative"){
    return narrativeFamiliesForLayer().filter(f=>growthState.dimension==="all"||f.dimension===growthState.dimension);
  }
  return layer==="L1"?(growth.families||[]):[];
}
function populateGrowthDimensions(){
  const sel=$("#growthDimension");sel.innerHTML="";
  if(growthState.mode!=="narrative"){
    const o=document.createElement("option");o.value="all";o.textContent="構文型では未使用";sel.appendChild(o);
    sel.disabled=true;growthState.dimension="all";return;
  }
  sel.disabled=false;
  const dims=[...new Set(narrativeFamiliesForLayer().map(f=>f.dimension||"物語"))];
  const all=document.createElement("option");all.value="all";all.textContent="すべて";sel.appendChild(all);
  for(const d of dims){
    const o=document.createElement("option");o.value=d;o.textContent=d;sel.appendChild(o);
  }
  if(!["all",...dims].includes(growthState.dimension))growthState.dimension="all";
  sel.value=growthState.dimension;
}
function resetGrowthHistory(){
  growthState.history={};growthState.stage=0;growthState.lastCenter=null;
  renderGrowthTrail();updateGrowthStageLabel();
}
function populateGrowthFamilies(){
  const list=growthFamilies();
  const sel=$("#growthFamily");sel.innerHTML="";
  for(const f of list){
    const o=document.createElement("option");
    o.value=f.id;
    o.textContent=growthState.mode==="narrative"?"["+(f.dimension||"物語")+"] "+f.label:f.stage0[1].replace("。","");
    sel.appendChild(o);
  }
  growthState.familyId=list[0]?.id||null;
  resetGrowthHistory();
}
function growthFamily(){
  return growthFamilies().find(f=>f.id===growthState.familyId)||growthFamilies()[0]||null;
}
function growthMaxStage(){
  const f=growthFamily();
  return growthState.mode==="narrative"?Math.max(0,(f?.stages?.length||1)-1):4;
}
function updateGrowthStageLabel(){
  const max=growthMaxStage();
  const wrapped=currentShown?.wrap_depth||0;
  $("#growthStage").textContent=wrapped>0?"外枠 "+wrapped+"段":"段階 "+growthState.stage+" / "+max;
  const available=growthFamilies().length>0;
  const canWrap=(layer!=="L3"||wrapped>0)&&compatibleSentenceWrappers().length>0;
  $("#growOne").disabled=!available&&!canWrap;
  $("#growBack").disabled=wrapped>0?!currentShown?.wrapped_from:(!available||growthState.stage<=0);
  $("#growthStart").disabled=!available;
  $("#growAgain").disabled=wrapped>0||!available;
  $("#growOne").textContent=wrapped>0?"さらに1段包む":(available&&growthState.stage>=max&&canWrap?"文を外側へ伸ばす":"1段伸ばす");
  $("#growBack").textContent=wrapped>0?"外枠を1段戻す":"1段戻す";
  for(const id of ["growthStart","growOne","growAgain","growBack"])$("#"+id).style.opacity=$("#"+id).disabled?".38":"1";
}
function trimGrowthHistory(afterStage){
  for(const k of Object.keys(growthState.history))if(+k>afterStage)delete growthState.history[k];
}
function rememberGrowth(x,replace=false){
  if(!x)return x;
  const st=x.growth_stage??0;
  if(replace)trimGrowthHistory(st);
  growthState.history[st]=x;
  growthState.stage=st;
  renderGrowthTrail();
  return x;
}
function renderGrowthTrail(){
  const box=$("#growthTrail");if(!box)return;
  box.innerHTML="";
  const stages=Object.keys(growthState.history).map(Number).sort((a,b)=>a-b);
  for(const st of stages){
    const x=growthState.history[st],e=document.createElement("div");
    e.className="trailItem"+(st===growthState.stage?" current":"");
    e.innerHTML="<span>"+st+"</span>"+x.display;
    e.onclick=()=>{growthState.stage=st;updateGrowthStageLabel();show(x);renderGrowthTrail()};
    box.appendChild(e);
  }
}
function growthCenter(stage,avoid){
  const list=growth.centers["stage"+stage]||[];
  if(!list.length)return null;
  let p=list.filter(x=>x[0]!==avoid);
  if(!p.length)p=list;
  return p[Math.floor(Math.random()*p.length)];
}
function makeStructuralGrowth(stage,reroll=false){
  const f=growthFamily();if(!f)return null;
  if(!reroll&&growthState.history[stage]){
    growthState.stage=stage;updateGrowthStageLabel();return growthState.history[stage];
  }
  if(stage<=0){
    resetGrowthHistory();
    const x={display:f.stage0[1],reading:f.stage0[0],family:"構文型長文化",origin:"GROW:"+f.id,japanese_quality:"A",weirdness:1,why:"短い自然文を長文化の起点にします。",growth_family:f.id,growth_stage:0,growth_mode:"structural"};
    return rememberGrowth(x,true);
  }
  const center=growthCenter(stage,reroll?growthState.lastCenter:null);if(!center)return null;
  growthState.lastCenter=center[0];
  const reading=f.left[0]+"も"+center[0]+"も"+f.right[0];
  const display=f.left[1]+"も"+center[1]+"も"+f.right[1]+"。";
  const x={display,reading,family:"構文型長文化",origin:"GROW:"+f.id,japanese_quality:stage<=3?"A":"B",weirdness:[1,1,2,3,4][stage],why:"同じ主題・述語を保ったまま、中心の人物関係だけを一段長くしました。",growth_family:f.id,growth_stage:stage,growth_mode:"structural"};
  return rememberGrowth(x,reroll);
}
function makeNarrativeGrowth(stage){
  const f=growthFamily();if(!f)return null;
  const max=Math.max(0,f.stages.length-1);
  stage=Math.max(0,Math.min(max,stage));
  if(growthState.history[stage]){growthState.stage=stage;updateGrowthStageLabel();return growthState.history[stage]}
  const st=f.stages[stage];
  const x={display:st.display,reading:st.reading,family:"物語型長文化",origin:"STORY:"+f.id,japanese_quality:st.japanese_quality||"A-",weirdness:st.weirdness??2,why:"今回追加した情報: "+(st.adds||"情報を追加"),growth_family:f.id,growth_stage:stage,growth_mode:"narrative"};
  return rememberGrowth(x,false);
}
function makeGrowth(stage,reroll=false){
  return growthState.mode==="narrative"?makeNarrativeGrowth(stage):makeStructuralGrowth(stage,reroll);
}
function growthStart(){resetGrowthHistory();show(makeGrowth(0))}
function growOne(){
  if(currentShown?.wrap_depth>0){wrapCurrentSentence();return}
  if(layer==="L3")return;
  const current=(currentShown?.growth_mode===growthState.mode&&currentShown?.growth_family===growthState.familyId)?(currentShown.growth_stage??growthState.stage):growthState.stage;
  const max=growthMaxStage();
  if(current>=max){
    if((growth.sentence_level_wrappers||[]).length)wrapCurrentSentence();
    return;
  }
  show(makeGrowth(current+1));
}
function growBack(){
  if(currentShown?.wrapped_from){unwrapCurrentSentence();return}
  if(layer==="L3")return;
  const current=(currentShown?.growth_mode===growthState.mode&&currentShown?.growth_family===growthState.familyId)?(currentShown.growth_stage??growthState.stage):growthState.stage;
  show(makeGrowth(Math.max(0,current-1)));
}
function growAgain(){
  if(layer!=="L1")return;
  const current=(currentShown?.growth_mode===growthState.mode&&currentShown?.growth_family===growthState.familyId)?(currentShown.growth_stage??growthState.stage):growthState.stage;
  if(growthState.mode==="structural"){show(makeGrowth(current,true));return}
  const eligible=growthFamilies().filter(f=>f.id!==growthState.familyId&&f.stages.length>current);
  if(eligible.length){
    const f=eligible[Math.floor(Math.random()*eligible.length)];
    growthState.familyId=f.id;$("#growthFamily").value=f.id;
    resetGrowthHistory();
    for(let st=0;st<=Math.min(current,growthMaxStage());st++)makeNarrativeGrowth(st);
  }
  show(growthState.history[Math.min(current,growthMaxStage())]||makeGrowth(Math.min(current,growthMaxStage())));
}

function startGrowthFromCurrent(){
  const m=findGrowthMatch(currentShown?.reading);if(!m)return;
  if(layer!==m.layer){
    layer=m.layer;
    document.querySelectorAll(".layer").forEach(x=>x.classList.toggle("active",x.dataset.layer===layer));
    updatePolicy();
  }
  growthState.mode=m.mode;$("#growthMode").value=m.mode;
  growthState.dimension=m.dimension||"all";
  populateGrowthDimensions();
  populateGrowthFamilies();
  growthState.familyId=m.family.id;$("#growthFamily").value=m.family.id;
  resetGrowthHistory();
  if(m.mode==="narrative"){
    for(let st=0;st<=m.stage;st++)makeNarrativeGrowth(st);
    show(growthState.history[m.stage]);
  }else{
    show(makeStructuralGrowth(0));
  }
}

function snapshotGrowthContext(){
  return {
    mode:growthState.mode,
    dimension:growthState.dimension,
    familyId:growthState.familyId,
    stage:growthState.stage,
    lastCenter:growthState.lastCenter,
    history:{...growthState.history}
  };
}
function restoreGrowthContext(ctx){
  if(!ctx)return;
  growthState.mode=ctx.mode||"structural";
  $("#growthMode").value=growthState.mode;
  growthState.dimension=ctx.dimension||"all";
  populateGrowthDimensions();
  populateGrowthFamilies();
  growthState.familyId=ctx.familyId||growthState.familyId;
  $("#growthFamily").value=growthState.familyId||"";
  growthState.stage=ctx.stage||0;
  growthState.lastCenter=ctx.lastCenter||null;
  growthState.history={...(ctx.history||{})};
  renderGrowthTrail();
  updateGrowthStageLabel();
}
function switchLayerWithoutGenerating(nextLayer){
  if(layer===nextLayer)return;
  layer=nextLayer;
  document.querySelectorAll(".layer").forEach(x=>x.classList.toggle("active",x.dataset.layer===layer));
  updatePolicy();
}
function wrapCurrentSentence(){
  const w=sentenceWrapper();
  if(!w||!currentShown||!isPal(currentShown.reading)||(layer==="L3"&&!currentShown?.wrap_depth))return;
  const parent=currentShown;
  const parentLayer=layer;
  const depth=(parent.wrap_depth||0)+1;
  const quoteMarks=[["「","」"],["『","』"],["〈","〉"],["《","》"],["【","】"],["〔","〕"],["［","］"],["（","）"],["〝","〟"],["“","”"],["‘","’"]];
  const q=quoteMarks[(depth-1)%quoteMarks.length];
  const reading=w.left_reading+parent.reading+w.right_reading;
  if(!isPal(reading))return;
  const display=w.left_display+q[0]+stripFinalPeriod(parent.display)+q[1]+w.right_display;
  const x={
    display,reading,
    family:"文レベル長文化",
    origin:"WRAP:"+w.id,
    japanese_quality:depth>=6?"C":(depth>=3?"B":(w.quality||"B+")),
    weirdness:Math.max(w.weirdness_floor||3,Math.min(5,2+depth)),
    why:w.semantic+"の外枠を追加。内側に同じ名詞がある外枠は自動除外しています。"+(depth>=6?" 6段以上のためL3実験域です。":""),
    wrap_depth:depth,
    wrapper_id:w.id,
    wrapper_outer_lexemes:w.outer_lexemes||[],
    wrapped_from:parent,
    wrapped_from_layer:parentLayer,
    growth_context:parent.growth_context||(parent.wrap_depth?null:snapshotGrowthContext())
  };
  switchLayerWithoutGenerating(depth>=6?"L3":"L2");
  show(x);
}
function unwrapCurrentSentence(){
  if(!currentShown?.wrapped_from)return;
  const child=currentShown;
  const parent=child.wrapped_from;
  switchLayerWithoutGenerating(child.wrapped_from_layer||"L2");
  if(!parent.wrap_depth&&child.growth_context)restoreGrowthContext(child.growth_context);
  show(parent);
}

document.querySelectorAll(".layer").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".layer").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");layer=b.dataset.layer;seen.clear();$("#list").innerHTML="";
  updatePolicy();seedOne();
});
$("#growthMode").onchange=e=>{
  growthState.mode=e.target.value;growthState.dimension="all";
  populateGrowthDimensions();populateGrowthFamilies();
  if(growthFamilies().length)growthStart();
};
$("#growthDimension").onchange=e=>{
  growthState.dimension=e.target.value;populateGrowthFamilies();
  if(growthFamilies().length)growthStart();
};
$("#growthFamily").onchange=e=>{
  growthState.familyId=e.target.value;resetGrowthHistory();
  if(growthFamilies().length)growthStart();
};
$("#weird").oninput=e=>{
  $("#weirdVal").textContent=e.target.value;seen.clear();$("#list").innerHTML="";updateCandidateCount();seedOne();
};
$("#seedGen").onclick=seedOne;
$("#dnaGen").onclick=dnaOne;
$("#pairGen").onclick=pairOne;
$("#seamGen").onclick=seamOne;
$("#growCurrent").onclick=startGrowthFromCurrent;
$("#wrapSentence").onclick=wrapCurrentSentence;
$("#unwrapSentence").onclick=unwrapCurrentSentence;
$("#growthStart").onclick=growthStart;
$("#growOne").onclick=growOne;
$("#growAgain").onclick=growAgain;
$("#growBack").onclick=growBack;
$("#ten").onclick=()=>{
  const box=$("#list");box.innerHTML="";
  const p=uniqueByReading([...pool().map(x=>({...x,origin:"原種"})),...dnaPool(true),...seamPool()]);
  const used=new Set();
  for(let i=0;i<10&&used.size<p.length;i++){
    let x;do{x=p[Math.floor(Math.random()*p.length)]}while(used.has(x.reading));
    used.add(x.reading);
    const e=document.createElement("div");e.className="item";
    e.innerHTML=(i+1)+". "+x.display+"<br><small>"+(x.origin||x.subgroup||"原種")+" / 日本語 "+(x.japanese_quality||"-")+" / 怪文 "+(x.weirdness??defaultWeird(layer))+"</small>";
    e.onclick=()=>show(x);box.appendChild(e);
  }
};

init().catch(e=>{$("#result").textContent="データ読込失敗";console.error(e)});
</script>
</body>
</html>
